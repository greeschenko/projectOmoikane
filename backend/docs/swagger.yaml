basePath: /api
definitions:
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  internal_handlers.TrashItem:
    properties:
      deletedAt:
        type: string
      entity:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  internal_handlers.batchRequest:
    properties:
      action:
        description: '"delete", "publish", "draft", "ban", "activate", "clear"'
        type: string
      ids:
        items:
          type: integer
        type: array
    type: object
  internal_handlers.changePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    type: object
  internal_handlers.contactRequest:
    properties:
      email:
        type: string
      message:
        type: string
      name:
        type: string
      recaptchaToken:
        type: string
      subject:
        type: string
    type: object
  internal_handlers.createCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  internal_handlers.createMessageRequest:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  internal_handlers.createPageRequest:
    properties:
      content:
        type: string
      inMenu:
        type: boolean
      metaDescription:
        type: string
      metaKeywords:
        type: string
      metaTitle:
        type: string
      parentId:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_handlers.createPostRequest:
    properties:
      categoryId:
        type: integer
      content:
        type: string
      excerpt:
        type: string
      featuredImage:
        type: string
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  internal_handlers.createTagRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  internal_handlers.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  internal_handlers.forgotPasswordRequest:
    properties:
      email:
        type: string
      recaptchaToken:
        type: string
    type: object
  internal_handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_handlers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      recaptchaToken:
        type: string
    type: object
  internal_handlers.reorderPagesRequest:
    properties:
      pageIds:
        items:
          type: integer
        type: array
    type: object
  internal_handlers.resetPasswordRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  internal_handlers.setupRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_handlers.updatePageRequest:
    properties:
      content:
        type: string
      inMenu:
        type: boolean
      metaDescription:
        type: string
      metaKeywords:
        type: string
      metaTitle:
        type: string
      parentId:
        type: integer
      slug:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_handlers.updatePostRequest:
    properties:
      categoryId:
        type: integer
      content:
        type: string
      excerpt:
        type: string
      featuredImage:
        type: string
      slug:
        type: string
      status:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  internal_handlers.updateProfileRequest:
    properties:
      avatar:
        type: string
      email:
        type: string
      name:
        type: string
    type: object
  internal_handlers.updateSettingsRequest:
    properties:
      blogEnabled:
        type: boolean
      favicon:
        type: string
      logo:
        type: string
      resetEmailBodyHTML:
        type: string
      resetEmailSubject:
        type: string
      siteName:
        type: string
      tagline:
        type: string
    type: object
  internal_handlers.updateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  omoikane-backend_internal_models.MediaItem:
    properties:
      createdAt:
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      filePath:
        type: string
      filename:
        type: string
      id:
        type: integer
      mimeType:
        type: string
      size:
        type: integer
      updatedAt:
        type: string
    type: object
info:
  contact:
    name: Omoikane
  description: REST API for the Omoikane CMS. Public endpoints do not require authentication;
    protected endpoints accept a Bearer token (or the session cookie set by login).
    Admin-only endpoints require an admin role.
  title: Omoikane API
  version: "1.0"
paths:
  /admin/blog/posts:
    get:
      description: Returns all blog posts regardless of status, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List all posts
      tags:
      - blog
  /audit-logs:
    get:
      description: Returns audit log entries from the audit microservice. Supports
        filters and pagination (limit <= 500).
      parameters:
      - description: Filter by entity type (e.g. user, page, post)
        in: query
        name: entity
        type: string
      - description: Filter by action (e.g. create, update, delete)
        in: query
        name: action
        type: string
      - description: Filter by actor user ID
        in: query
        name: userId
        type: integer
      - description: Search user name or detail
        in: query
        name: search
        type: string
      - description: Max results (1-500, default 100)
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a password reset link if the account exists. Rate limited
        to 3 requests per 15 minutes per IP.
      parameters:
      - description: Account email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request password reset
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates credentials, sets an HttpOnly session cookie and
        emits a login audit event.
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the session cookie and emits a logout audit event.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: User logout
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account. Requires a valid reCAPTCHA token when
        reCAPTCHA is configured.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password using a token from the password reset email.
      parameters:
      - description: Reset token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Reset password
      tags:
      - auth
  /blog/categories:
    get:
      description: Returns all blog categories.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List categories
      tags:
      - blog
    post:
      consumes:
      - application/json
      description: Creates a blog category. Slug defaults to a generated slug from
        the name.
      parameters:
      - description: Category details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - blog
  /blog/categories/{id}:
    delete:
      description: Soft-deletes a blog category.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete category
      tags:
      - blog
  /blog/posts:
    get:
      description: Returns blog posts with status published, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List published posts
      tags:
      - blog
    post:
      consumes:
      - application/json
      description: Creates a blog post. Slug defaults to a generated slug from the
        title. Tags are associated by name.
      parameters:
      - description: Post details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create post
      tags:
      - blog
  /blog/posts/{id}:
    delete:
      description: Soft-deletes a post; the record moves to trash and can be restored.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete post
      tags:
      - blog
    get:
      description: Returns a single blog post by its numeric ID.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get post by ID
      tags:
      - blog
    put:
      consumes:
      - application/json
      description: Updates the provided fields of a post. When tags is present, the
        tag set is replaced entirely.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update post
      tags:
      - blog
  /blog/posts/{id}/like:
    post:
      description: Toggles the current user's like on a post and returns the new liked
        state and count.
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Like / unlike a post
      tags:
      - blog
  /blog/posts/batch:
    post:
      consumes:
      - application/json
      description: Applies an action (delete, publish, draft) to multiple posts.
      parameters:
      - description: Action and post IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.batchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch post actions
      tags:
      - blog
  /blog/posts/slug/{slug}:
    get:
      description: Returns a single published blog post by its slug.
      parameters:
      - description: Post slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get post by slug
      tags:
      - blog
  /blog/tags:
    get:
      description: Returns all blog tags.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List tags
      tags:
      - blog
    post:
      consumes:
      - application/json
      description: Creates a blog tag. Slug defaults to a generated slug from the
        name.
      parameters:
      - description: Tag details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createTagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create tag
      tags:
      - blog
  /blog/tags/{id}:
    delete:
      description: Soft-deletes a blog tag.
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete tag
      tags:
      - blog
  /contact:
    post:
      consumes:
      - application/json
      description: Stores a contact form submission. Requires a valid reCAPTCHA token
        when reCAPTCHA is configured.
      parameters:
      - description: Contact form data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.contactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Submit contact form
      tags:
      - contacts
  /contacts:
    get:
      description: Returns all contact form messages, newest first, plus the number
        of unread ones.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List contact submissions
      tags:
      - contacts
  /contacts/{id}:
    delete:
      description: Soft-deletes a contact form message; it moves to trash and can
        be restored.
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete contact submission
      tags:
      - contacts
    get:
      description: Returns a single contact form message by ID.
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get contact submission
      tags:
      - contacts
  /contacts/{id}/read:
    post:
      description: Marks a contact form message as read.
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark contact read
      tags:
      - contacts
  /dashboard:
    get:
      description: Returns counts of users, pages, posts, media and messages.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard content counts
      tags:
      - dashboard
  /dashboard/stats:
    get:
      description: Returns content counts plus the 5 most recent user registrations
        and messages.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Dashboard stats
      tags:
      - dashboard
  /health:
    get:
      description: Returns the service status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /media:
    get:
      description: Returns all media items, newest first, each with base64-encoded
        data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List media
      tags:
      - media
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file (multipart/form-data, field name "file"). Returns
        the media item with base64-encoded data.
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload media file
      tags:
      - media
  /media/{id}:
    delete:
      description: Soft-deletes a media record; the file stays on disk until hard-purged
        from trash.
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete media item
      tags:
      - media
    get:
      description: Returns a single media item by its numeric ID.
      parameters:
      - description: Media ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/omoikane-backend_internal_models.MediaItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get media item
      tags:
      - media
  /media/batch:
    post:
      consumes:
      - application/json
      description: Applies an action (delete) to multiple media items.
      parameters:
      - description: Action and media IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.batchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch media actions
      tags:
      - media
  /messages:
    delete:
      description: Hard-deletes every message row.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Delete all messages
      tags:
      - messages
    get:
      description: Returns all messages plus the number of messages unread by the
        current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List messages
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Creates a new message visible to authenticated users.
      parameters:
      - description: Message details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create message
      tags:
      - messages
  /messages/{id}:
    delete:
      description: Soft-deletes a message; it moves to trash and can be restored.
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete message
      tags:
      - messages
    get:
      description: Returns a single message by its numeric ID.
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get message
      tags:
      - messages
  /messages/{id}/read:
    post:
      description: Marks a message as read for the current user.
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark message read
      tags:
      - messages
  /messages/read-all:
    post:
      description: Marks every message as read for the current user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Mark all messages read
      tags:
      - messages
  /pages:
    get:
      description: Returns pages. Unauthenticated requests and ?menu=true only receive
        published pages.
      parameters:
      - description: Return only published menu pages
        in: query
        name: menu
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      summary: List pages
      tags:
      - pages
    post:
      consumes:
      - application/json
      description: Creates a page. Slug defaults to a generated slug from the title
        when omitted.
      parameters:
      - description: Page details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createPageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create page
      tags:
      - pages
  /pages/{id}:
    delete:
      description: Soft-deletes a page; the record moves to trash and can be restored.
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete page
      tags:
      - pages
    get:
      description: Returns a single page by its numeric ID.
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get page by ID
      tags:
      - pages
    put:
      consumes:
      - application/json
      description: Updates the provided fields of a page.
      parameters:
      - description: Page ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updatePageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update page
      tags:
      - pages
  /pages/batch:
    post:
      consumes:
      - application/json
      description: Applies an action (delete, publish, draft) to multiple pages.
      parameters:
      - description: Action and page IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.batchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch page actions
      tags:
      - pages
  /pages/reorder:
    put:
      consumes:
      - application/json
      description: Reorders pages by assigning sort_order based on the order of pageIds.
      parameters:
      - description: Ordered page IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.reorderPagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reorder pages
      tags:
      - pages
  /pages/slug/{slug}:
    get:
      description: Returns a single published page by its slug. Includes parent title/slug
        when a parent exists.
      parameters:
      - description: Page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get page by slug
      tags:
      - pages
  /settings:
    get:
      description: Returns site name, tagline, logo, favicon, blog toggle and email
        template settings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get site settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: Updates the provided site settings fields.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update site settings
      tags:
      - settings
  /settings/password:
    post:
      consumes:
      - application/json
      description: Changes the current user's password after verifying the current
        one.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.changePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - settings
  /settings/profile:
    get:
      description: Returns id, name, email, role and avatar for the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Updates the current user's name, email and/or avatar.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - settings
  /setup:
    post:
      consumes:
      - application/json
      description: Creates the first admin user. Only succeeds while the database
        has no users.
      parameters:
      - description: Email and password for the admin account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.setupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Initialize admin account
      tags:
      - auth
  /setup/check:
    get:
      description: Returns whether an admin account still needs to be created (first
        run).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: Check setup status
      tags:
      - auth
  /trash:
    delete:
      description: Hard-deletes all trash items, or only the given entity's items
        when ?entity= is provided.
      parameters:
      - description: Only empty this entity type (page, user, post, media, contact,
          message, tag, category)
        in: query
        name: entity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Empty trash
      tags:
      - trash
    get:
      description: Returns soft-deleted pages, users, posts, media, contacts, messages,
        tags and categories.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.TrashItem'
            type: array
      security:
      - BearerAuth: []
      summary: List trash items
      tags:
      - trash
  /trash/{entity}/{id}:
    delete:
      description: Hard-deletes an item by entity type and ID. Media files are removed
        from disk.
      parameters:
      - description: Entity type (page, user, post, media, contact, message, tag,
          category)
        in: path
        name: entity
        required: true
        type: string
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Permanently delete trash item
      tags:
      - trash
  /trash/{entity}/{id}/restore:
    post:
      description: Restores a soft-deleted item by entity type and ID.
      parameters:
      - description: Entity type (page, user, post, media, contact, message, tag,
          category)
        in: path
        name: entity
        required: true
        type: string
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore trash item
      tags:
      - trash
  /trash/count:
    get:
      description: Returns the total number of soft-deleted items across all entities.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              format: int64
              type: integer
            type: object
      security:
      - BearerAuth: []
      summary: Trash count
      tags:
      - trash
  /users:
    get:
      description: Returns all users with sensitive fields (password) omitted.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user with the given role and status.
      parameters:
      - description: User details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: Soft-deletes a user; the record moves to trash and can be restored.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates the provided fields of a user. Password, when supplied,
        is hashed.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
  /users/batch:
    post:
      consumes:
      - application/json
      description: Applies an action (delete, ban, activate) to multiple users.
      parameters:
      - description: Action and user IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.batchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Batch user actions
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
