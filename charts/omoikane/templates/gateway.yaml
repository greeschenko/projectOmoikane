# Gateway — the exact docker-compose nginx config, verbatim.
# charts/omoikane/files/nginx.conf is the SINGLE source of truth (compose
# mounts it too). Upstream hostnames (auth-service:8082, ..., frontend:3000)
# resolve via the fixed Kubernetes Service names in this chart, preserving
# every gateway behavior: static proxy_pass prefix-stripping, exact-match
# locations, /api/ fail-loud 404, proxy_redirect for the swagger UIs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app: nginx
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        {{- include "omoikane.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.gateway.image }}
          ports:
            - { name: http, containerPort: 80 }
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app: nginx
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.serviceType }}
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      {{- if and .Values.gateway.nodePort (ne .Values.gateway.serviceType "ClusterIP") }}
      nodePort: {{ .Values.gateway.nodePort }}
      {{- end }}