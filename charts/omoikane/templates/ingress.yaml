# Optional cloud Ingress in front of the nginx gateway. Disabled by default —
# minikube/kind expose the gateway via a NodePort (values-minikube/kind.yaml);
# a managed cluster can enable this and point TLS/cert-manager at the gateway.
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omoikane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
{{- end }}