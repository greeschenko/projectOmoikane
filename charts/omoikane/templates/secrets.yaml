{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: omoikane-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
type: Opaque
# Dev defaults only — override `secrets.jwtSecret` / `secrets.internalToken`
# in your values file, or pre-create a Secret and set secrets.existingSecret.
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret }}
  internal-token: {{ .Values.secrets.internalToken }}
{{- end }}