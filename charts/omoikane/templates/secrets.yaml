{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: omoikane-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omoikane.labels" . | nindent 4 }}
type: Opaque
# Dev defaults only — override `secrets.jwtSecret` / `secrets.internalToken` /
# `secrets.smtpPass` / `secrets.recaptchaSecret` in your values file, or
# pre-create a Secret and set secrets.existingSecret.
stringData:
  jwt-secret: {{ .Values.secrets.jwtSecret }}
  internal-token: {{ .Values.secrets.internalToken }}
  smtp-pass: {{ .Values.secrets.smtpPass | default "" }}
  recaptcha-secret: {{ .Values.secrets.recaptchaSecret | default "" }}
{{- end }}