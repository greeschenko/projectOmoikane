{{- /*
Phase 35 demo receiver — webhook-sink. A hermetic in-cluster HTTP target for
webhook deliveries (records POSTs; GET /requests for debugging/tests), so the
e2e gate and demos need no third-party image. NOT gateway-facing: the webhooks
service delivers to it directly at http://webhook-sink:8091/hook (same Service
name in docker-compose, so compose and k8s configuration stays byte-identical).
Runs /app/bin/webhook-sink from the shared backend image — NOT part of
.Values.backend.ports because it has no API surface behind the gateway.
*/ -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: {{ .Release.Namespace }}
  labels:
    app: webhook-sink
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
        {{- include "omoikane.selectorLabels" . | nindent 8 }}
      {{- if .Values.observability.prometheusAnnotations }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8091"
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      containers:
        - name: webhook-sink
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["/app/bin/webhook-sink"]
          ports:
            - { name: http, containerPort: 8091 }
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          env:
            - { name: SINK_PORT, value: "8091" }
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: {{ .Release.Namespace }}
  labels:
    app: webhook-sink
    {{- include "omoikane.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: webhook-sink
  ports:
    - { name: http, port: 8091, targetPort: 8091 }