# Base values — cloud-agnostic dev defaults. Override per-provider:
#   values-minikube.yaml / values-kind.yaml / (future) values-eks.yaml ...
#
# IMPORTANT — fixed resource names. Every Kubernetes Service is named exactly
# like its docker-compose counterpart (postgres, redis, kafka, frontend, nginx,
# auth-service, content-service, ...). The nginx gateway ConfigMap and the
# service env vars embed those hostnames/DSNs, so verbatim reuse (zero drift)
# is only possible if these names never change. One release per namespace.

images:
  backend:
    repository: omoikane/backend
    tag: phase36
    pullPolicy: IfNotPresent
  frontend:
    repository: omoikane/frontend
    tag: phase36
    pullPolicy: IfNotPresent

secrets:
  # Dev defaults only. For production pre-create your own Secret and set
  # `.Values.secrets.existingSecret`; these values are then ignored.
  jwtSecret: "dev-secret-change-in-production"
  internalToken: "dev-internal-token-change-me"
  # SMTP password + ReCAPTCHA secret moved into the Secret (Phase 34): the
  # auth/messages Deployments reference them via secretKeyRef, never as plain
  # env values. Keep in sync with `.Values.auth.smtp*` when overriding.
  smtpPass: ""
  recaptchaSecret: ""
  # SASL password for external/managed Kafka (Phase 36) — rendered into the
  # Secret and consumed via secretKeyRef, so credentials never sit in a values
  # file. Confluent Cloud API keys / MSK SCRAM passwords go here.
  externalKafkaPassword: ""
  existingSecret: ""

postgres:
  image: postgres:16-alpine
  user: omoikane
  password: omoikane
  database: omoikane        # main store (shared by auth/content/media/messages/settings)
  auditDatabase: omoikane_audit
  storage: 5Gi

redis:
  image: redis:7-alpine     # shared public-cache (no persistence needed)

kafka:
  image: apache/kafka:3.9.0
  storage: 5Gi
  bootstrap: kafka:29092    # single-node KRaft dual-listener, internal broker
  eventsTopic: omoikane.events
  dlqTopic: omoikane.events.dlq

# Managed cloud services (Phase 36). Flip the matching `enabled` flag to bypass
# the in-cluster Deployment/Service for that component and point the platform at
# the external endpoint (RDS/CloudSQL/Azure DB, MSK/Confluent, ElastiCache/...
# ). Runbooks: docs/cloud/{eks,gke,aks}.md. With all three disabled (default),
# rendering is byte-identical to the pre-Phase-36 chart.
external:
  postgres:
    enabled: false
    host: ""            # managed endpoint, no scheme/port (e.g. mydb.cluster-xxx.rds.amazonaws.com)
    port: 5432
    user: ""
    # Credential for the managed instance. Put real values in a gitignored
    # drop-in values file or --set — never committed (same trust model as
    # `.Values.postgres.password`).
    password: ""
    sslmode: require
    # NOTE: both databases (omoikane + omoikane_audit) must exist on the
    # managed instance; the platform maps services to them via
    # `.Values.backend.databases` exactly as it does in-cluster.
  kafka:
    enabled: false
    bootstrap: ""       # e.g. b-1.msk…:9098 or pkc-….confluent.cloud:9092
    # "", "SSL" (TLS only) or "SASL_SSL" (TLS + SASL credentials). PLAINTEXT
    # (in-VPC MSK) needs "" — leave mechanism/username empty.
    securityProtocol: ""
    # "PLAIN" (Confluent Cloud) | "SCRAM-SHA-256" | "SCRAM-SHA-512" (MSK).
    saslMechanism: ""
    saslUsername: ""    # the SASL password goes in `secrets.externalKafkaPassword`
    # Override topic names on managed brokers (some providers pre-provision and
    # restrict auto-create; KAFKA_AUTO_CREATE-style defaults still apply).
    eventsTopic: omoikane.events
    dlqTopic: omoikane.events.dlq
  redis:
    enabled: false
    url: ""             # full redis:// / rediss:// URL (e.g. rediss://:pw@mycache…:6379/0)

# Per-service catalog. `ports` is the source of truth: the range in
# templates/backend.yaml emits one Deployment + one Service per entry.
# `databases` maps each DB-backed service to its database name, `redis` /
# `kafka` / `internalToken` are name lists selecting which services receive
# which env blocks (mirrors docker-compose exactly).
backend:
  replicas: 1
  ports:
    auth: 8082
    content: 8083
    media: 8084
    messages: 8085
    settings: 8086
    trash: 8087
    dashboard: 8088
    docs: 8089
    audit: 8081
    webhooks: 8090
  databases:
    auth: omoikane
    content: omoikane
    media: omoikane
    messages: omoikane
    settings: omoikane
    audit: omoikane_audit
    webhooks: omoikane
  redis:
    - auth
    - content
    - settings
  kafka:
    - auth
    - content
    - media
    - messages
    - settings
    - audit
    - webhooks
  internalToken:
    - auth
    - content
    - media
    - messages
    - settings
    - trash
    - dashboard

auth:
  smtpHost: ""
  smtpPort: "587"
  smtpUser: ""
  smtpFrom: noreply@omoikane.local
  # smtpPass / recaptchaSecret live in `secrets.*` (rendered into the Secret,
  # consumed via secretKeyRef — Phase 34).

media:
  baseUrl: ""               # absolute CDN URL override when set (else relative)
  uploadStorage: 5Gi        # RWO PVC; scale media replicas >1 needs RWX + shared FS

gateway:
  image: nginx:alpine
  serviceType: LoadBalancer # minikube/kind override to NodePort for k8s-test
  nodePort: 30080

frontend:
  replicas: 1
  apiUrl: http://nginx      # SSR fetches flow through the gateway Service DNS

# Resource requests/limits (Phase 34). Sized to fit the 6 CPU / 6 GiB minikube
# node used by `make k8s-up`; raise for heavier workloads. Applied to every
# container in the corresponding template.
resources:
  backend:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  frontend:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 768Mi }
  gateway:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 250m, memory: 256Mi }
  postgres:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  redis:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }
  kafka:
    requests: { cpu: 500m, memory: 768Mi }
    limits: { cpu: 1500m, memory: 1536Mi }

# HorizontalPodAutoscaler manifests (Phase 34). DEFAULT OFF: an HPA with
# minReplicas > 0 fights `make k8s-db-reset`'s scale-to-0 (HPA would scale the
# DB-owning deployments back up and block the DROP). Enable per-target only in
# environments where the gate tooling differs; manifests render (and validate)
# on demand via helm template --set autoscaling.enabled=true.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilization: 60
  targetMemoryUtilization: 70

# Per-service schema migration Jobs (Phase 34). Each DB-backed service ships a
# MIGRATE_ONLY=1 early-exit (connect + AutoMigrate + outbox, then exit) so the
# chart can run it as a hermetic post-install/post-upgrade hook Job — schema
# deploys become explicit and a failed migration fails the release (fail-loud).
# Startup auto-migration stays in place (restart-safe; k8s-db-reset relies on
# it re-running migrations on scale-back-to-1).
migrations:
  enabled: true

# Prometheus scrape annotations on backend pods (Phase 34). /metrics is served
# by every service on its own port; the gateway intentionally has no /metrics
# route. Wire these annotations into your scraping config (Prometheus
# Operator / kube-prometheus-stack discover them out of the box).
observability:
  prometheusAnnotations: true

ingress:
  enabled: false            # optional cloud Ingress in front of the nginx gateway
  host: omoikane.local