services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npx next dev --webpack
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omoikane
      POSTGRES_PASSWORD: omoikane
      POSTGRES_DB: omoikane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omoikane"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
