services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - audit-service
      - auth-service
      - content-service
      - media-service

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: PLAINTEXT (external, advertised localhost:9092) serves
      # host-side tooling + `make go-test` integration tests; PLAINTEXT_INTERNAL
      # (advertised kafka:29092) serves services inside the compose network
      # (auth-service relay, later content/media sinks). Distinct ports make the
      # advertised-address selection unambiguous per connecting client.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npx next dev --webpack
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@omoikane.local
      - RECAPTCHA_SECRET=
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_BASE_URL=
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Wave 1 auth service (Phase 29): separate process, shared Postgres store
  # with the monolith until the Phase 31 aggregator work. Emits user.registered
  # via the outbox -> Kafka relay (KAFKA_BROKERS reachable inside compose).
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/auth
    ports:
      - "8082:8082"
    environment:
      - AUTH_PORT=8082
      - AUTH_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@omoikane.local
      - RECAPTCHA_SECRET=
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 2 content service (Phase 30): separate process, shared Postgres store
  # with the monolith until the Phase 31 aggregator work. Owns pages + blog
  # (posts/tags/categories); gateway flips /api/pages*, /api/blog/* and
  # /api/admin/blog/* here. Emits page.published / post.published via the
  # outbox -> Kafka relay. Shares the monolith's Redis so cache flushes stay
  # consistent across SSR (backend:8080) and gateway reads.
  content-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/content
    ports:
      - "8083:8083"
    environment:
      - CONTENT_PORT=8083
      - CONTENT_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 2 media service (Phase 30): separate process, shared Postgres store +
  # shared uploads disk (../backend:/app bind mounts both containers at the same
  # backend/uploads directory). Owns media CRUD + CDN-ready file delivery;
  # gateway flips /api/media* and /media/ here. Emits media.uploaded via the
  # outbox -> Kafka relay.
  media-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/media
    ports:
      - "8084:8084"
    environment:
      - MEDIA_PORT=8084
      - MEDIA_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - AUDIT_SERVICE_URL=http://audit-service:8081
      - UPLOAD_DIR=/app/uploads
      - MEDIA_BASE_URL=
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  audit-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/audit
    environment:
      - AUDIT_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane_audit sslmode=disable
      - AUDIT_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omoikane
      POSTGRES_PASSWORD: omoikane
      POSTGRES_DB: omoikane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omoikane"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
  kafka-data:
