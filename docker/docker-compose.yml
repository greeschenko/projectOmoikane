services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Single source of truth: the gateway config lives in the Helm chart and
      # is shared verbatim by minikube/kind (charts/omoikane/files/nginx.conf).
      - ../charts/omoikane/files/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - audit-service
      - auth-service
      - content-service
      - media-service
      - messages-service
      - settings-service
      - trash-service
      - dashboard-service
      - docs-service
      - webhooks-service

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listener: PLAINTEXT (external, advertised localhost:9092) serves
      # host-side tooling + `make go-test` integration tests; PLAINTEXT_INTERNAL
      # (advertised kafka:29092) serves services inside the compose network
      # (auth-service relay, later content/media sinks). Distinct ports make the
      # advertised-address selection unambiguous per connecting client.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npx next dev --webpack
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # SSR fetches flow through the gateway (http://nginx), not a backend
      # process — the monolith is retired in Phase 31.
      - API_URL=http://nginx
    depends_on:
      - audit-service
      - auth-service
      - content-service
      - media-service
      - messages-service
      - settings-service
      - trash-service
      - dashboard-service
      - docs-service
      - webhooks-service

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Wave 1 auth service (Phase 29): separate process, shared Postgres store
  # with the monolith until the Phase 31 aggregator work. Emits user.registered
  # via the outbox -> Kafka relay (KAFKA_BROKERS reachable inside compose).
  # Phase 31: serves the dashboard facade + trash aggregator over /internal/*
  # (INTERNAL_TOKEN), and joins the shared Redis so user writes flush the
  # public cache the content service + SSR reads share.
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/auth
    ports:
      - "8082:8082"
    environment:
      - AUTH_PORT=8082
      - AUTH_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@omoikane.local
      - RECAPTCHA_SECRET=
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 2 content service (Phase 30): separate process, shared Postgres store
  # with the monolith until the Phase 31 aggregator work. Owns pages + blog
  # (posts/tags/categories); gateway flips /api/pages*, /api/blog/* and
  # /api/admin/blog/* here. Emits page.published / post.published via the
  # outbox -> Kafka relay. Shares the shared Redis so cache flushes stay
  # consistent across SSR and gateway reads. Phase 31: serves the dashboard
  # facade + trash aggregator over /internal/* (INTERNAL_TOKEN).
  content-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/content
    ports:
      - "8083:8083"
    environment:
      - CONTENT_PORT=8083
      - CONTENT_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 2 media service (Phase 30): separate process, shared Postgres store +
  # shared uploads disk (../backend:/app bind mounts both containers at the same
  # backend/uploads directory). Owns media CRUD + CDN-ready file delivery;
  # gateway flips /api/media* and /media/ here. Emits media.uploaded via the
  # outbox -> Kafka relay. Phase 31: serves the dashboard facade + trash
  # aggregator over /internal/* (INTERNAL_TOKEN); media hard-delete keeps the
  # disk cleanup in this service.
  media-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/media
    ports:
      - "8084:8084"
    environment:
      - MEDIA_PORT=8084
      - MEDIA_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - UPLOAD_DIR=/app/uploads
      - MEDIA_BASE_URL=
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 3 messages service (Phase 31): separate process, shared Postgres store.
  # Owns the public contact form + admin contact inbox + broadcast messages;
  # gateway flips /api/contact*, /api/contacts*, /api/messages* here. No public
  # GET surface, so no cache wiring. Phase 31: serves the dashboard facade +
  # trash aggregator over /internal/* (INTERNAL_TOKEN).
  messages-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/messages
    ports:
      - "8085:8085"
    environment:
      - MESSAGES_PORT=8085
      - MESSAGES_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - RECAPTCHA_SECRET=
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 3 settings service (Phase 31): separate process, shared Postgres store.
  # Owns the public cached GET /settings + admin PUT /settings; gateway flips
  # /api/settings here (auth keeps /api/settings/profile|password via
  # longest-prefix matching in nginx). Shares the shared Redis so settings
  # writes flush the public cache.
  settings-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/settings
    ports:
      - "8086:8086"
    environment:
      - SETTINGS_PORT=8086
      - SETTINGS_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8086/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 3 trash aggregator (Phase 31): thin cross-cutting service, NO database.
  # Owns GET/POST/DELETE /trash* for the gateway and fans out to each owning
  # service's /internal/trash endpoints with the shared INTERNAL_TOKEN.
  trash-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/trash
    ports:
      - "8087:8087"
    environment:
      - TRASH_PORT=8087
      - JWT_SECRET=dev-secret-change-in-production
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - AUTH_SERVICE_URL=http://auth-service:8082
      - CONTENT_SERVICE_URL=http://content-service:8083
      - MEDIA_SERVICE_URL=http://media-service:8084
      - MESSAGES_SERVICE_URL=http://messages-service:8085
    depends_on:
      - auth-service
      - content-service
      - media-service
      - messages-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8087/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 3 dashboard facade (Phase 31): aggregator over every owning service's
  # /internal/stats endpoint, NO database. Owns GET /dashboard* for the gateway.
  dashboard-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/dashboard
    ports:
      - "8088:8088"
    environment:
      - DASHBOARD_PORT=8088
      - JWT_SECRET=dev-secret-change-in-production
      - INTERNAL_TOKEN=dev-internal-token-change-me
      - AUTH_SERVICE_URL=http://auth-service:8082
      - CONTENT_SERVICE_URL=http://content-service:8083
      - MEDIA_SERVICE_URL=http://media-service:8084
      - MESSAGES_SERVICE_URL=http://messages-service:8085
    depends_on:
      - auth-service
      - content-service
      - media-service
      - messages-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8088/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Wave 3 docs service (Phase 31): serves the main API Swagger UI
  # (httpSwagger over the swag-generated backend/docs embed). Gateway routes
  # /api/swagger/ here.
  docs-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/docs
    ports:
      - "8089:8089"
    environment:
      - DOCS_PORT=8089
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8089/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  audit-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/audit
    ports:
      - "8081:8081"
    environment:
      - AUDIT_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane_audit sslmode=disable
      - AUDIT_PORT=8081
      # Phase 31: the gateway routes /api/audit-logs directly here, so the
      # audit service validates the admin JWT itself (shared JWT_SECRET).
      - JWT_SECRET=dev-secret-change-in-production
      # Phase 32: audit write path is the Kafka backbone — the service consumes
      # the events topic (group "audit") instead of the retired HTTP POST /events.
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 35 webhook module: subscription CRUD + delivery log (admin UI at
  # /admin/webhooks) and the delivery pipeline. A Kafka consumer (group
  # "webhooks") maps backbone CloudEvents -> pending WebhookDelivery rows
  # (idempotent via unique (subscription, event) index); a pump worker POSTs
  # each payload to the subscription URL (HMAC-SHA256 signed), retries with
  # exponential backoff, then marks the delivery expired (DLQ-equivalent).
  # Consumer-only service; owns the webhook_* tables in the shared omoikane
  # store (7th MIGRATE_ONLY migration Job in the chart).
  webhooks-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/webhooks
    ports:
      - "8090:8090"
    environment:
      - WEBHOOKS_PORT=8090
      - WEBHOOKS_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_EVENTS_TOPIC=omoikane.events
      - KAFKA_DLQ_TOPIC=omoikane.events.dlq
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      webhook-sink:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 35 demo receiver: hermetic in-cluster HTTP target for webhook
  # deliveries (records POSTs, exposes GET /requests). Exists so the e2e gate
  # needs no third-party image. NOT gateway-facing.
  webhook-sink:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/webhook-sink
    ports:
      - "8091:8091"
    environment:
      - SINK_PORT=8091
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8091/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omoikane
      POSTGRES_PASSWORD: omoikane
      POSTGRES_DB: omoikane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omoikane"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
  kafka-data:
