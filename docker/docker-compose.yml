services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - audit-service

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npx next dev --webpack
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - API_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@omoikane.local
      - RECAPTCHA_SECRET=
      - AUDIT_SERVICE_URL=http://audit-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      audit-service:
        condition: service_healthy

  audit-service:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
    command: go run ./cmd/audit
    environment:
      - AUDIT_DATABASE_URL=host=postgres port=5432 user=omoikane password=omoikane dbname=omoikane_audit sslmode=disable
      - AUDIT_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omoikane
      POSTGRES_PASSWORD: omoikane
      POSTGRES_DB: omoikane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omoikane"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
