events {}

http {
    # Route-split gateway (Phase 27 blueprint).
    # Every /api/* group below maps to a target service. Today every target is
    # still the monolith (backend:8080) so the contract is unchanged; Phases
    # 29-31 flip each proxy_pass host per service, gated by the full Playwright
    # suite. Mapping: backend/docs/service-boundaries.md.
    #
    # nginx semantics used: for a prefix location, the matched prefix is
    # replaced by the proxy_pass URI, so `/api/trash/page/5/restore` with
    # location `/api/trash` -> `/trash/page/5/restore` (entity segment kept).

    # Upstream blocks name each future microservice; all point at the monolith
    # today. A later phase only changes the `server` line(s).
    upstream auth_service {
        server backend:8080;
    }
    upstream content_service {
        server backend:8080;
    }
    upstream media_service {
        server backend:8080;
    }
    upstream messages_service {
        server backend:8080;
    }
    upstream settings_service {
        server backend:8080;
    }
    upstream audit_service {
        server audit-service:8081;
    }
    upstream dashboard_service {
        server backend:8080;
    }
    upstream trash_service {
        server backend:8080;
    }

    server {
        listen 80;

        # Shared proxy headers (inherited by all /api locations).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- Auth service (extracted Phase 29) ---
        location /api/setup {
            proxy_pass http://auth_service/setup$is_args$args;
            proxy_redirect /swagger/ /api/swagger/;
        }
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
        }
        location /api/users {
            proxy_pass http://auth_service/users$is_args$args;
        }
        location /api/api-tokens {
            proxy_pass http://auth_service/api-tokens$is_args$args;
        }
        location /api/settings/profile {
            proxy_pass http://auth_service/settings/profile;
        }
        location /api/settings/password {
            proxy_pass http://auth_service/settings/password;
        }

        # --- Content service (extracted Phase 30) ---
        location /api/pages {
            proxy_pass http://content_service/pages$is_args$args;
        }
        location /api/blog/ {
            proxy_pass http://content_service/blog/;
        }

        # --- Media service (extracted Phase 30) ---
        location /api/media {
            proxy_pass http://media_service/media$is_args$args;
        }

        # --- Messages service (extracted Phase 31) ---
        location /api/contact {
            proxy_pass http://messages_service/contact$is_args$args;
        }
        location /api/contacts {
            proxy_pass http://messages_service/contacts$is_args$args;
        }
        location /api/messages {
            proxy_pass http://messages_service/messages$is_args$args;
        }

        # --- Settings service (extracted Phase 31) ---
        location /api/settings {
            proxy_pass http://settings_service/settings$is_args$args;
            proxy_redirect /swagger/ /api/swagger/;
        }

        # --- Audit service (existing microservice) ---
        location /api/audit/ {
            proxy_pass http://audit_service/;
            proxy_redirect /swagger/ /api/audit/swagger/;
        }
        location = /api/audit-logs {
            proxy_pass http://backend:8080/audit-logs; # monolith proxy -> audit (Phase 32: direct/event-driven)
        }

        # --- Dashboard service (extracted Phase 31) ---
        location /api/dashboard {
            proxy_pass http://dashboard_service/dashboard$is_args$args;
        }

        # --- Trash service (Phase 31; aggregates auth/content/media/messages) ---
        location /api/trash {
            proxy_pass http://trash_service/trash$is_args$args;
        }

        # --- Swagger UI (main API) + any unmapped /api route (monolith today) ---
        location /api/ {
            proxy_pass http://backend:8080/;
            proxy_redirect /swagger/ /api/swagger/;
        }

        location /media/ {
            proxy_pass http://backend:8080;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status "cdn";
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}