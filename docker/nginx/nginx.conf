events {}

http {
    # Route-split gateway (Phase 27 blueprint, fully flipped in Phase 31).
    # Every /api/* group maps to a target service: auth (:8082), content
    # (:8083), media (:8084), messages (:8085), settings (:8086), trash
    # (:8087), dashboard (:8088), docs/swagger (:8089), audit (:8081). The
    # monolith (backend:8080) is retired — the /api/ catch-all is now fail-loud
    # so unmapped routes surface instead of silently hitting a dead target.
    # Mapping: backend/docs/service-boundaries.md.
    #
    # nginx semantics used: for a prefix location, the matched prefix is
    # replaced by the proxy_pass URI, so `/api/users/batch` with
    # location `/api/users` -> `/users/batch` (segment kept). Each service mux
    # therefore registers paths WITHOUT the /api prefix.
    #
    # IMPORTANT: proxy_pass URIs must be STATIC (no variables). A proxy_pass
    # that contains a variable ($is_args$args, $request_uri, ...) is passed to
    # the upstream verbatim and DROPS the location-remainder path segments —
    # `/api/users/5` would reach the upstream as `/users`, silently breaking
    # every sub-segment route. With a static URI, nginx substitutes the prefix
    # correctly and the query string is forwarded automatically.

    upstream auth_service {
        server auth-service:8082;
    }
    upstream content_service {
        server content-service:8083;
    }
    upstream media_service {
        server media-service:8084;
    }
    upstream messages_service {
        server messages-service:8085;
    }
    upstream settings_service {
        server settings-service:8086;
    }
    upstream trash_service {
        server trash-service:8087;
    }
    upstream dashboard_service {
        server dashboard-service:8088;
    }
    upstream docs_service {
        server docs-service:8089;
    }
    upstream audit_service {
        server audit-service:8081;
    }

    server {
        listen 80;

        # Shared proxy headers (inherited by all /api locations).
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # --- Auth service (extracted Phase 29) ---
        location /api/setup {
            proxy_pass http://auth_service/setup;
        }
        location /api/auth/ {
            proxy_pass http://auth_service/auth/;
        }
        location /api/users {
            proxy_pass http://auth_service/users;
        }
        location /api/api-tokens {
            proxy_pass http://auth_service/api-tokens;
        }
        location /api/settings/profile {
            proxy_pass http://auth_service/settings/profile;
        }
        location /api/settings/password {
            proxy_pass http://auth_service/settings/password;
        }

        # --- Content service (extracted Phase 30) ---
        location /api/pages {
            proxy_pass http://content_service/pages;
        }
        # NOTE: separate prefix from /api/blog/ — a trailing-slash location does
        # NOT match /api/admin/blog/posts, so the admin post listing needs its
        # own block (content-service registers /admin/blog/posts).
        location /api/admin/blog/ {
            proxy_pass http://content_service/admin/blog/;
        }
        location /api/blog/ {
            proxy_pass http://content_service/blog/;
        }

        # --- Media service (extracted Phase 30) ---
        location /api/media {
            proxy_pass http://media_service/media;
        }

        # --- Messages service (extracted Phase 31) ---
        location /api/contact {
            proxy_pass http://messages_service/contact;
        }
        location /api/contacts {
            proxy_pass http://messages_service/contacts;
        }
        location /api/messages {
            proxy_pass http://messages_service/messages;
        }

        # --- Settings service (extracted Phase 31) ---
        # Longest-prefix wins: /api/settings/profile and /api/settings/password
        # (auth identity routes) are matched above before this block.
        location /api/settings {
            proxy_pass http://settings_service/settings;
        }

        # --- Audit service (existing microservice) ---
        location /api/audit/ {
            proxy_pass http://audit_service/;
            proxy_redirect /swagger/ /api/audit/swagger/;
        }
        # Phase 31: the gateway routes the admin audit-log page directly to the
        # audit service (its own AdminRequired + JWT_SECRET), no monolith proxy.
        location = /api/audit-logs {
            proxy_pass http://audit_service/audit-logs;
        }

        # --- Dashboard service (extracted Phase 31) ---
        location /api/dashboard {
            proxy_pass http://dashboard_service/dashboard;
        }

        # --- Trash service (Phase 31; aggregates auth/content/media/messages) ---
        location /api/trash {
            proxy_pass http://trash_service/trash;
        }

        # --- Swagger UI (main API; docs service extracted Phase 31) ---
        location /api/swagger/ {
            proxy_pass http://docs_service/swagger/;
            proxy_redirect /swagger/ /api/swagger/;
        }

        # --- Fail-loud: any unmapped /api route must surface, not hang ---
        location /api/ {
            return 404;
        }

        location /media/ {
            proxy_pass http://media_service;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status "cdn";
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }
    }
}